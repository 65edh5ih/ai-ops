name: Review inbox

# レビューの「未 resolve な指摘」を全リポジトリから集め、2種類の一覧に落とす。**投稿者は問わない**
# （理由はスクリプト冒頭「投稿者で選別しない」。要は Claude Code の指摘はオーナー本人の login で
# 投稿されるため、レビュアーの許可リストでは分離できない）。
#
# なぜ必要か: 指摘は同期 PR のマージ後に届くことがあり、そのとき配布変更を出したセッションは
# 終わっている。ops-sync 本体の PR には出ず consumer 同期 PR にだけ出る指摘もある。配布物（shared/）への
# 指摘を取りこぼすと欠陥が全 consumer に残る。→ shared/docs/ops-sync-design.md「レビューの取りこぼし対策」
#
# **ops-sync でだけ動かす**（shared/ に置かず consumer へ配布しない）。理由:
#   - 走査は全リポジトリ横断なので1箇所でよい。
#   - ops-sync は public なのでこの workflow 自身の実行分は無料（private の月枠を食わない）。定期実行を
#     回せるのはこのため（頻度は下記のとおり毎時）。
#   - consumer 側に走査用トークンを配らずに済む（「consumer に常設トークンを増やさない」原則）。
#
# 出力は2種類（実行は public、成果物の可視性は置き場で分ける）:
#   - **全体一覧** … 全リポジトリ分をリポジトリごとにグループ化し、セッションに貼るコピペ用の依頼文を
#     添える。全リポジトリの内容が混ざるので **private リポジトリにだけ**置く（ops-sync は世界公開なので
#     ここには置けない。MUST NOT）。人がトリアージに使う。
#   - **リポジトリごとのスライス** … private consumer の `.ops-sync/review-inbox.md` に自分の分だけ。
#     どのエージェントでも自分の作業リポジトリで読める（issue は GitHub API アクセスが要る＝ランタイム
#     依存になるので使わない。`.ops-sync/tasks/` と同じ「物理的に届ける」作法）。public の ops-sync / ops-runner
#     は main を PR 必須で保護するため直接 push せず、private の全体一覧だけに載せる。
#
# fork PR から secret に触れさせないため、トリガは schedule と workflow_dispatch だけにする
# （pull_request 系のトリガを足さないこと）。

on:
  schedule:
    # **毎時**。実行分は無料（public リポジトリ）なので頻度のコストは無いが、`*/15` は GitHub 側で
    # 間引かれて**1度も発火しなかった**（12:00/12:15/12:30 の3枠連続で run が作られず、同時間帯の
    # sync は動いていたのでアカウント側の問題ではない）。高頻度スケジュールほど優先度を落とされるため、
    # 確実に回る頻度に下げる。指摘はマージの2〜3分後に付くので、実効の気づきは60〜90分。
    # 急ぐときは workflow_dispatch で即時に回せる。
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '直近スキャンで遡る日数（既定 3）。過去分を洗い直すときだけ大きい値を入れて1回流す'
        type: string
        required: false

permissions:
  contents: write # publish-ci-logs が ops-sync の ci-logs ブランチへ push するのに必要

concurrency:
  group: review-inbox
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # 全体一覧の置き場（private リポジトリ）。repo variable で移せるようにしておく。
      # **全リポジトリの内容が混ざるので private 限定**（ops-sync・ops-runner は public）。
      # 旧名 CODEX_INBOX_REPO も読む: 変数の張り替えが済むまでの間に既定値へ黙って落ちると、
      # 全リポジトリ分の一覧が意図しないリポジトリへ push される。
      INBOX_ALL_REPO: ${{ vars.REVIEW_INBOX_REPO || vars.CODEX_INBOX_REPO || '65edh5ih/private' }}
      INBOX_ALL_PATH: .ops-sync/review-inbox-all.md
      # 各リポジトリに置く「自分の分だけ」のスライス。全リポジトリで同じパスにする
      # （エージェントへの指示を「`.ops-sync/review-inbox.md` を読め」の1文に固定できる）。
      SLICE_PATH: .ops-sync/review-inbox.md
    steps:
      - name: Checkout ops-sync
        uses: actions/checkout@v5
        with:
          path: ops-sync

      # 走査対象を clone し、そのうち private consumer だけをスライスの書き込み先にする。
      # full clone は不要（main の先端にだけ書く）。
      # **どのリポジトリも `.ops-sync/` へのパスは push トリガの paths に入っていない**ことを前提にしている
      # （入れると毎時 CI が起動して Actions 枠を焼く。consumer に workflow を足すときは確認する）。
      - name: Clone target repos
        env:
          TOKEN: ${{ secrets.OPS_SYNC_TOKEN }}
          REPO_SELF: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p clones
          { cat ops-sync/consumers.txt; printf '\n%s\n' "$REPO_SELF"; } \
            | sed -E 's/#.*$//' | tr -s '[:space:]' '\n' | grep -E '^[^/]+/[^/]+$' | sort -u \
            > /tmp/target-repos.txt
          # public repo は main を PR 必須の ruleset で保護する。毎時の在庫更新のために bypass を与えたり
          # PR を量産したりせず、走査と private の全体一覧への掲載だけ行う。
          grep -Ev '^(65edh5ih/ops-sync|65edh5ih/ops-runner)$' /tmp/target-repos.txt \
            > /tmp/slice-repos.txt
          while read -r repo; do
            mkdir -p "clones/${repo%/*}"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${repo}.git" "clones/${repo}"
          done < /tmp/target-repos.txt

      - id: collect
        name: Collect unresolved review findings
        env:
          RI_TOKEN: ${{ secrets.OPS_SYNC_TOKEN }}
          RI_CLONES: clones
          # 置き場は上の INBOX_ALL_REPO / INBOX_ALL_PATH が正本（値を2箇所に複製しない）
          RI_OUT_ALL: clones/${{ env.INBOX_ALL_REPO }}/${{ env.INBOX_ALL_PATH }}
          # 手動実行の入力 > repo variable > スクリプト既定（3日）の順。窓を広げるほど GraphQL の
          # レートを食うので、常用は狭く保ち、過去分の洗い直しだけ dispatch で大きくする。
          RI_LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.REVIEW_INBOX_LOOKBACK_DAYS || vars.CODEX_INBOX_LOOKBACK_DAYS || '' }}
        # 走査対象は consumer 全部＋ops-sync 自身（ops-sync 本体の PR にも指摘は付く）。
        #
        # ログは docs/ci-logs.md 手順A-2 のとおり logs/ci/scripts/<name>.log へ残す。
        # **このログは ops-sync の ci-logs＝世界公開に載る**ので、スクリプトは件数と repo 名しか出さない
        # （指摘本文・パスを出さない。private の内容が公開に落ちるため）。
        run: |
          set -uo pipefail
          mkdir -p logs/ci/scripts
          RI_REPOS="$(cat /tmp/target-repos.txt)" \
            RI_SLICE_REPOS="$(cat /tmp/slice-repos.txt)" \
            node ops-sync/scripts/review-inbox.mjs 2>&1 | tee logs/ci/scripts/review-inbox.log

      - name: Commit and push changed inventories
        if: steps.collect.outputs.files_changed != '0'
        env:
          OPEN: ${{ steps.collect.outputs.open_findings }}
          MERGED: ${{ steps.collect.outputs.merged_unresolved }}
        run: |
          set -uo pipefail
          rc=0
          # 生成物を退避しておく。**push 競合時は main を取り直して再適用する**ため
          # （定期的に回るうえ、対象は sync PR が頻繁にマージされる main。clone から push までの
          # 数十秒の間に main が動いて non-fast-forward で弾かれるのは日常的に起きる。実測済み）。
          stage=/tmp/inbox-stage
          rm -rf "$stage"
          while read -r repo; do
            mkdir -p "$stage/${repo}"
            cp -a "clones/${repo}/.ops-sync" "$stage/${repo}/" 2>/dev/null || true
          done < /tmp/slice-repos.txt

          while read -r repo; do
            d="clones/${repo}"
            git -C "$d" config user.name 'ops-sync[bot]'
            git -C "$d" config user.email 'ops-sync@users.noreply.github.com'
            pushed=0
            for attempt in 1 2 3 4 5; do
              git -C "$d" add -A -- .ops-sync
              # 差分ゼロなら空コミットで履歴を汚さない（再取得の結果、既に同じ内容だった場合も含む）
              if git -C "$d" diff --cached --quiet; then pushed=1; break; fi
              git -C "$d" commit -q -m "chore(review-inbox): 未対応 ${OPEN} 件（マージ済み ${MERGED} 件）"
              if git -C "$d" push origin HEAD:main 2>/dev/null; then pushed=1; break; fi
              echo "review-inbox: push attempt ${attempt} failed for ${repo}; refreshing main..."
              # 生成物は毎回作り直せるので、マージせず main を取り直して上書きし直すのが最も確実
              git -C "$d" fetch --depth=1 origin main 2>/dev/null || true
              git -C "$d" reset --hard FETCH_HEAD >/dev/null 2>&1 || true
              cp -a "$stage/${repo}/.ops-sync/." "$d/.ops-sync/" 2>/dev/null || true
              # cp は**削除を再現しない**。取り直した main には旧名の在庫が居るので消し直す
              # （スクリプト側の LEGACY_* と同じ名前。旧名がどの consumer にも無くなったら消してよい）。
              # `.ops-sync/` 丸ごとの同期（rsync --delete 等）にはしない——取り直した main が
              # 別セッションの更新（sync-manifest.txt 等）を持っていると、それごと巻き戻すため。
              rm -f "$d/.ops-sync/codex-review-inbox.md" "$d/.ops-sync/codex-review-inbox-all.md"
              sleep "$((attempt * 3))"
            done
            # **1リポジトリの失敗で残りを諦めない**（他の一覧まで古いまま据え置かれる）
            if [ "$pushed" != "1" ]; then
              echo "::warning::review-inbox: failed to push ${repo} after retries"
              rc=1
            fi
          done < /tmp/slice-repos.txt
          exit "$rc"

      - name: Summarize
        if: always()
        env:
          OPEN: ${{ steps.collect.outputs.open_findings }}
          MERGED: ${{ steps.collect.outputs.merged_unresolved }}
          FAILURES: ${{ steps.collect.outputs.failures }}
          CHANGED: ${{ steps.collect.outputs.files_changed }}
        run: |
          set -uo pipefail
          {
            printf '## Review inbox\n\n'
            printf -- '- open findings: **%s**（うちマージ済み PR: %s）\n' "${OPEN:-?}" "${MERGED:-?}"
            printf -- '- unreadable repos: %s\n' "${FAILURES:-?}"
            printf -- '- files rewritten: %s\n' "${CHANGED:-?}"
            printf -- '- aggregate: `%s` in `%s`\n' "$INBOX_ALL_PATH" "$INBOX_ALL_REPO"
            printf -- '- per-repo slice: `%s` in private target repos (public repos are aggregate-only)\n' "$SLICE_PATH"
          } >> "$GITHUB_STEP_SUMMARY"

      # docs/ci-logs.md 手順A-3（成功・失敗を問わず常時）。
      # publish 先は ops-sync の ci-logs＝世界公開なので、万一のトークン混入に備えて伏字をかける。
      - name: Stage CI log snapshot
        if: always()
        run: |
          set -uo pipefail
          mkdir -p review-inbox-out
          if [ -f logs/ci/scripts/review-inbox.log ]; then
            sed -E \
              -e 's/gh[pousr]_[A-Za-z0-9]{20,}/[REDACTED-SECRET]/g' \
              -e 's/github_pat_[A-Za-z0-9_]{20,}/[REDACTED-SECRET]/g' \
              logs/ci/scripts/review-inbox.log > review-inbox-out/review-inbox.log
          fi

      # dest は信号ごとに分ける（publish-ci-logs は publish 前に dest を rm -rf するため）。
      - name: Publish logs to ci-logs branch
        if: always()
        uses: ./ops-sync/.github/actions/publish-ci-logs
        with:
          source-dir: review-inbox-out
          dest: review-inbox
          commit-message: "ci(review-inbox): open=${{ steps.collect.outputs.open_findings || '?' }}"
          token: ${{ github.token }}

      # ── 一覧に積んだだけで終わらせない ──────────────────────────────────────
      # ここまでで指摘は集まるが、**一覧はファイルなので誰かが見に行かないと気づけない**。
      # 上り提案が自動マージされる経路（→ docs/outbox-proposal.md）では取り込み PR を扱うセッションが
      # 居ないため、配布物の欠陥が consumer 同期 PR にだけ出た場合、拾う人が居ないまま残る。
      # マージ済み PR の未 resolve（🔴）は「欠陥が既に配布済みで、誰も対応していない」状態なので、
      # run を失敗させて badge に出す。open PR の指摘（🟡）はその PR を見ている者が居るので対象外。
      #
      # 取得失敗（読めなかった repo）も失敗にする——短い一覧を黙って出すと「指摘ゼロ」と区別できない。
      #
      # このログは ops-sync の ci-logs＝世界公開に載るので、**件数と repo 名までしか出さない**
      # （指摘本文・パスは MUST NOT。中身は private の全体一覧と各 repo のスライスで読む）。
      - name: Flag findings nobody is on
        if: always()
        env:
          MERGED: ${{ steps.collect.outputs.merged_unresolved }}
          MERGED_REPOS: ${{ steps.collect.outputs.merged_unresolved_repos }}
          FAILURES: ${{ steps.collect.outputs.failures }}
        run: |
          set -u
          waiting=0
          if [ -n "${MERGED:-}" ] && [ "${MERGED}" != "0" ]; then
            echo "::error::マージ済み PR に未 resolve のレビュー指摘が ${MERGED} 件あります（${MERGED_REPOS:-?}）。配布物への指摘なら全 consumer に欠陥が残っています。一覧: ${INBOX_ALL_PATH} in ${INBOX_ALL_REPO}（private repo は ${SLICE_PATH} にも自分の分がある）"
            waiting=1
          fi
          if [ -n "${FAILURES:-}" ] && [ "${FAILURES}" != "0" ]; then
            echo "::error::${FAILURES} 件の対象を読み取れませんでした。その分は未確認です（指摘が無いという意味ではない）。一覧の「取得できなかったもの」を参照。"
            waiting=1
          fi
          exit "$waiting"
