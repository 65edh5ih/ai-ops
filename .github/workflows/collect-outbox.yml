name: Collect outbox proposals from consumers

# consumer → ops-sync の「上り」。最古の提案を持つ consumer の .ops-sync/outbox/*.md を
# まとめて拾い、種別に応じて処理する:
#   - common-block-edit : AGENTS_COMMON.md への取り込み PR を生成
#   - shared-file       : shared/<対象パス> への配置 PR を生成
#   - task              : tasks/<対象リポジトリ>/ への登録 PR を生成
#   - task-done         : tasks/<提案元>/<対象ファイル> の削除 PR を生成
# ops-sync 側の取り込み PR（全提案まとめて1本）と consumer 側の cleanup PR の 2 本を自動生成。
# 取り込み PR のマージは人間（オーナー）が行う。不正な提案は .ops-sync/outbox/rejected/ へ
# エラーノート付きで差し戻す（キューを塞がない）。同一実行内で衝突する提案（2件目の
# common-block-edit 等）と他 consumer の提案は次回実行に回る。
#
# あわせて保守バッチとして、この run で clone した consumer を使い sync-deletions.txt の
# 役目を終えたトゥームストーン（全 consumer から対象ファイルが消えた行）を自動で刈る。
#
# トリガーは cron ポーリング＋手動。以前は consumer からの repository_dispatch（即時）
# だったが、そのために各 consumer へ ops-sync に Contents:RW できる PAT を置く必要があり、
# 「どの consumer からでもルールの正本に書ける」トークンが増殖していた。ルール訂正に
# 即時性は不要なので、consumer 側のトークン・workflow を全廃してポーリングに戻した。
# 急ぐときは workflow_dispatch で手動起動する。

on:
  schedule:
  - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: collect-outbox
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # consumer の clone を ops-sync のチェックアウト内に置くと、取り込み PR 作成時の
      # git add -A が nested repo を gitlink として拾ってしまう。ops-sync と consumers を
      # workspace 直下の兄弟ディレクトリに分離する。
      - name: Checkout ops-sync
        uses: actions/checkout@v5
        with:
          path: ops-sync

      # ログは2つに分ける（→ docs/ci-logs.md「ログの公開先」）。処理ログは提案のファイル名と却下理由を
      # 含み、それは提案元 consumer の中身なので、public な ops-sync ではなく**提案元リポジトリ自身の
      # ci-logs** へ出す。ops-sync 側には件数・種別だけのロールアップを残す。
      - name: Set up log directories
        run: |
          mkdir -p /tmp/ci-logs /tmp/ci-logs-public
          cat > /tmp/ci-logs/summary.md << EOF
          # Collect outbox proposals (detail)
          - Run: ${{ github.run_id }}
          - Triggered by: ${{ github.event_name }}
          - ops-sync ref: ${{ github.sha }}
          - Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          cat > /tmp/ci-logs-public/summary.md << EOF
          # Collect outbox proposals
          - Run: ${{ github.run_id }}
          - Triggered by: ${{ github.event_name }}
          - Ref: ${{ github.sha }}
          - Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Clone consumers (read outbox + stage cleanup)
        env:
          TOKEN: ${{ secrets.OPS_SYNC_TOKEN }}
        run: |
          mkdir -p consumers
          while read -r repo; do
            mkdir -p "consumers/${repo%/*}"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${repo}.git" "consumers/${repo}"
          done < <(grep -vE '^[[:space:]]*(#|$)' ops-sync/consumers.txt)

      - id: collect
        name: Apply proposals (one consumer per run)
        env:
          PR_BODY_PATH: ${{ runner.temp }}/pr-body.md
          CLEANUP_BODY_PATH: ${{ runner.temp }}/cleanup-body.md
        # 出力（提案名・却下理由）を **tee でジョブログに出さない**（MUST。docs/ci-logs.md 手順A-6）。
        # public リポジトリの run ログは world-readable なので、ci-logs の置き場だけ分けても
        # ジョブログ側から同じものが読めてしまう。詳細は提案元 consumer の ci-logs で読む。
        run: |
          set -uo pipefail
          node ops-sync/scripts/collect-outbox.mjs ops-sync/AGENTS_COMMON.md consumers ops-sync \
            > /tmp/ci-logs/collect-outbox.log 2>&1

      - name: Record collect result
        if: always()
        run: |
          # 詳細（提案のファイル名を含む）＝提案元 consumer 行き
          {
            echo "- Found: ${{ steps.collect.outputs.found }}"
            echo "- Type: ${{ steps.collect.outputs.type }}"
            echo "- Consumer: ${{ steps.collect.outputs.consumer }}"
            echo "- Proposals: ${{ steps.collect.outputs.proposal }}"
            echo "- Applied/Rejected/Deferred: ${{ steps.collect.outputs.applied }}/${{ steps.collect.outputs.rejected }}/${{ steps.collect.outputs.deferred }}"
            echo "- Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> /tmp/ci-logs/summary.md
          # 公開ロールアップ＝件数・種別・repo 名まで（提案のファイル名・却下理由は出さない）。
          # Result は**まず outcome で見る**: collect が落ちると outputs は空のままなので、
          # 出力の空だけで判定すると「提案ゼロ」と失敗が同じ表示になる（恒久ログに成功と読める嘘が残る）。
          {
            echo "- Result: ${{ steps.collect.outcome != 'success' && 'collect FAILED' || (steps.collect.outputs.consumer != '' && 'processed' || 'no proposals') }}"
            echo "- Found: ${{ steps.collect.outputs.found }}"
            echo "- Type: ${{ steps.collect.outputs.type }}"
            echo "- Consumer: ${{ steps.collect.outputs.consumer }}"
            echo "- Applied/Rejected/Deferred: ${{ steps.collect.outputs.applied }}/${{ steps.collect.outputs.rejected }}/${{ steps.collect.outputs.deferred }}"
            echo "- Detail log (when a consumer was processed): \`collect-outbox/latest\` on that consumer's \`ci-logs\` branch"
            echo "- Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> /tmp/ci-logs-public/summary.md

      # collect が **consumer を決める前に**落ちた場合だけ、失敗ログを公開側へ回す。その時点までの出力には
      # 提案のファイル名・本文は出ていない（スクリプトは consumer を確定した時点でそれを output に出し、
      # 提案ごとのログはその後で出し始める）ので公開して安全。これが無いと、ジョブログにも出していない
      # 以上、失敗の詳細がどこにも残らない。consumer が決まっていれば詳細ログはその consumer 側に出る。
      - name: Stage failure log for the public roll-up
        if: always() && steps.collect.outcome != 'success' && steps.collect.outputs.consumer == ''
        run: cp /tmp/ci-logs/collect-outbox.log /tmp/ci-logs-public/collect-failure.log || true

      - name: Open intake PR to ops-sync
        if: steps.collect.outputs.found == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          path: ops-sync
          token: ${{ secrets.OPS_SYNC_TOKEN }}
          base: main
          branch: ${{ steps.collect.outputs.branch }}
          delete-branch: true
          commit-message: ${{ steps.collect.outputs.pr_title }}
          title: ${{ steps.collect.outputs.pr_title }}
          body-path: ${{ runner.temp }}/pr-body.md

      - name: Open cleanup PR to consumer (remove/reject processed proposals)
        if: steps.collect.outputs.consumer_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          path: ${{ steps.collect.outputs.consumer_dir }}
          token: ${{ secrets.OPS_SYNC_TOKEN }}
          base: main
          branch: ${{ steps.collect.outputs.cleanup_branch }}
          delete-branch: true
          commit-message: 'chore: ops-sync が処理した提案を outbox から整理'
          title: ${{ steps.collect.outputs.cleanup_title }}
          body-path: ${{ runner.temp }}/cleanup-body.md

      # ── 保守バッチ: 役目を終えたトゥームストーンの掃除 ─────────────────────────
      # 上の collect が ops-sync チェックアウトを取り込み PR 用に書き換えるため、
      # 掃除は別チェックアウトで行い、独立した PR にする（機械的削除なので自動マージ）。
      - name: Checkout ops-sync (tombstone prune)
        uses: actions/checkout@v5
        with:
          path: ops-sync-prune

      # 掃除対象は ops-sync 自身の sync-deletions.txt（public な正本の中身）なので公開側へ。
      - name: Prune completed tombstones from sync-deletions.txt
        run: |
          set -uo pipefail
          node ops-sync/scripts/prune-tombstones.mjs ops-sync-prune consumers 2>&1 \
            | tee /tmp/ci-logs-public/prune-tombstones.log

      - name: Open tombstone prune PR
        id: prune-pr
        uses: peter-evans/create-pull-request@v8
        with:
          path: ops-sync-prune
          token: ${{ secrets.OPS_SYNC_TOKEN }}
          base: main
          branch: ops-sync/prune-tombstones
          delete-branch: true
          commit-message: 'chore: 全 consumer で削除済みのトゥームストーンを整理'
          title: 'chore: sync-deletions.txt の役目を終えた行を整理'
          body: |
            `sync-deletions.txt` のうち、全 consumer の main に対象ファイルがもう存在しない行を削ります
            （collect workflow の保守バッチが自動生成。判定はこの run で clone した各 consumer の main に対して行いました）。

      - name: Merge tombstone prune PR
        if: steps.prune-pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.OPS_SYNC_TOKEN }}
        run: |
          gh pr merge --squash "${{ steps.prune-pr.outputs.pull-request-url }}" \
            || echo "::warning::merge failed; PR left open: ${{ steps.prune-pr.outputs.pull-request-url }}"

      # 詳細ログ（提案名・却下理由）→ この run で処理した提案元 consumer の ci-logs。
      # 提案が1件も無い run では consumer が決まらないので publish しない（出す相手がいない）。
      - name: Publish detailed CI logs to the source consumer
        if: always() && steps.collect.outputs.consumer != ''
        uses: ./ops-sync/.github/actions/publish-ci-logs
        with:
          repository: ${{ steps.collect.outputs.consumer }}
          source-dir: /tmp/ci-logs
          dest: collect-outbox/latest
          history-dir: collect-outbox/history
          retention-days: "7"
          run-id: ${{ github.run_id }}
          commit-message: "ci-logs: collect-outbox (run ${{ github.run_id }})"
          token: ${{ secrets.OPS_SYNC_TOKEN }}

      - name: Publish public roll-up
        if: always()
        uses: ./ops-sync/.github/actions/publish-ci-logs
        with:
          source-dir: /tmp/ci-logs-public
          dest: collect-outbox/latest
          history-dir: collect-outbox/history
          retention-days: "7"
          run-id: ${{ github.run_id }}
          commit-message: "ci-logs: collect-outbox (run ${{ github.run_id }})"
          token: ${{ secrets.OPS_SYNC_TOKEN }}
