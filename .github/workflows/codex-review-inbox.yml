name: Codex review inbox

# Codex レビューの「未 resolve な指摘」を全リポジトリから集め、2種類の一覧に落とす。
#
# なぜ必要か: Codex の指摘は同期 PR のマージ後に届くことがあり、そのとき配布変更を出したセッションは
# 終わっている。ops-sync 本体の PR には出ず consumer 同期 PR にだけ出る指摘もある。配布物（shared/）への
# 指摘を取りこぼすと欠陥が全 consumer に残る。→ shared/docs/ops-sync-design.md「Codex レビューの取りこぼし対策」
#
# **ops-sync でだけ動かす**（shared/ に置かず consumer へ配布しない）。理由:
#   - 走査は全リポジトリ横断なので1箇所でよい。
#   - ops-sync は public なのでこの workflow 自身の実行分は無料（private の月枠を食わない）。15分ごとに
#     回せるのはこのため。
#   - consumer 側に走査用トークンを配らずに済む（「consumer に常設トークンを増やさない」原則）。
#
# 出力は2種類（実行は public、成果物の可視性は置き場で分ける）:
#   - **全体一覧** … 全リポジトリ分をリポジトリごとにグループ化し、セッションに貼るコピペ用の依頼文を
#     添える。全リポジトリの内容が混ざるので **private リポジトリにだけ**置く（ops-sync は世界公開なので
#     ここには置けない。MUST NOT）。人がトリアージに使う。
#   - **リポジトリごとのスライス** … 各リポジトリの `.ops-sync/codex-review-inbox.md` に自分の分だけ。
#     どのエージェントでも自分の作業リポジトリで読める（issue は GitHub API アクセスが要る＝ランタイム
#     依存になるので使わない。`.ops-sync/tasks/` と同じ「物理的に届ける」作法）。
#
# fork PR から secret に触れさせないため、トリガは schedule と workflow_dispatch だけにする
# （pull_request 系のトリガを足さないこと）。

on:
  schedule:
    # 15分ごと。Codex の指摘はマージの2〜3分後に付くので、実効の気づきまでは15〜30分
    # （GitHub の schedule はベストエフォートでズレる）。public リポジトリなので実行分は無料。
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write # publish-ci-logs が ops-sync の ci-logs ブランチへ push するのに必要

concurrency:
  group: codex-review-inbox
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # 全体一覧の置き場（private リポジトリ）。repo variable で移せるようにしておく。
      # **全リポジトリの内容が混ざるので private 限定**（ops-sync・ops-runner は public）。
      INBOX_ALL_REPO: ${{ vars.CODEX_INBOX_REPO || '65edh5ih/private' }}
      INBOX_ALL_PATH: .ops-sync/codex-review-inbox-all.md
      # 各リポジトリに置く「自分の分だけ」のスライス。全リポジトリで同じパスにする
      # （エージェントへの指示を「`.ops-sync/codex-review-inbox.md` を読め」の1文に固定できる）。
      SLICE_PATH: .ops-sync/codex-review-inbox.md
    steps:
      - name: Checkout ops-sync
        uses: actions/checkout@v5
        with:
          path: ops-sync

      # 走査対象＝スライスの書き込み先。full clone は不要（main の先端にだけ書く）。
      # **どのリポジトリも `.ops-sync/` へのパスは push トリガの paths に入っていない**ことを前提にしている
      # （入れると15分ごとに CI が起動して Actions 枠を焼く。consumer に workflow を足すときは確認する）。
      - name: Clone target repos
        env:
          TOKEN: ${{ secrets.OPS_SYNC_TOKEN }}
          REPO_SELF: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p clones
          { cat ops-sync/consumers.txt; printf '\n%s\n' "$REPO_SELF"; } \
            | sed -E 's/#.*$//' | tr -s '[:space:]' '\n' | grep -E '^[^/]+/[^/]+$' | sort -u \
            > /tmp/target-repos.txt
          while read -r repo; do
            mkdir -p "clones/${repo%/*}"
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${repo}.git" "clones/${repo}"
          done < /tmp/target-repos.txt

      - id: collect
        name: Collect unresolved Codex findings
        env:
          CRI_TOKEN: ${{ secrets.OPS_SYNC_TOKEN }}
          CRI_CLONES: clones
          CRI_OUT_ALL: clones/${{ vars.CODEX_INBOX_REPO || '65edh5ih/private' }}/.ops-sync/codex-review-inbox-all.md
          CRI_LOOKBACK_DAYS: ${{ vars.CODEX_INBOX_LOOKBACK_DAYS || '30' }}
        # 走査対象は consumer 全部＋ops-sync 自身（ops-sync 本体の PR にも指摘は付く）。
        #
        # ログは docs/ci-logs.md 手順A-2 のとおり logs/ci/scripts/<name>.log へ残す。
        # **このログは ops-sync の ci-logs＝世界公開に載る**ので、スクリプトは件数と repo 名しか出さない
        # （指摘本文・パスを出さない。private の内容が公開に落ちるため）。
        run: |
          set -uo pipefail
          mkdir -p logs/ci/scripts
          CRI_REPOS="$(cat /tmp/target-repos.txt)" \
            node ops-sync/scripts/codex-review-inbox.mjs 2>&1 | tee logs/ci/scripts/codex-review-inbox.log

      - name: Commit and push changed inventories
        if: steps.collect.outputs.files_changed != '0'
        env:
          OPEN: ${{ steps.collect.outputs.open_findings }}
          MERGED: ${{ steps.collect.outputs.merged_unresolved }}
        run: |
          set -uo pipefail
          rc=0
          while read -r repo; do
            d="clones/${repo}"
            git -C "$d" config user.name 'ops-sync[bot]'
            git -C "$d" config user.email 'ops-sync@users.noreply.github.com'
            git -C "$d" add -A -- .ops-sync
            # 差分ゼロなら空コミットで履歴を汚さない
            if git -C "$d" diff --cached --quiet; then continue; fi
            git -C "$d" commit -q -m "chore(codex-inbox): 未対応 ${OPEN} 件（マージ済み ${MERGED} 件）"
            # **1リポジトリの push 失敗で残りを諦めない**（他の一覧まで古いまま据え置かれる）。
            if ! git -C "$d" push origin HEAD:main; then
              echo "::warning::codex-inbox: push failed for ${repo}"
              rc=1
            fi
          done < /tmp/target-repos.txt
          exit "$rc"

      - name: Summarize
        if: always()
        env:
          OPEN: ${{ steps.collect.outputs.open_findings }}
          MERGED: ${{ steps.collect.outputs.merged_unresolved }}
          FAILURES: ${{ steps.collect.outputs.failures }}
          CHANGED: ${{ steps.collect.outputs.files_changed }}
        run: |
          set -uo pipefail
          {
            printf '## Codex review inbox\n\n'
            printf -- '- open findings: **%s**（うちマージ済み PR: %s）\n' "${OPEN:-?}" "${MERGED:-?}"
            printf -- '- unreadable repos: %s\n' "${FAILURES:-?}"
            printf -- '- files rewritten: %s\n' "${CHANGED:-?}"
            printf -- '- aggregate: `%s` in `%s`\n' "$INBOX_ALL_PATH" "$INBOX_ALL_REPO"
            printf -- '- per-repo slice: `%s` in each target repo\n' "$SLICE_PATH"
          } >> "$GITHUB_STEP_SUMMARY"

      # docs/ci-logs.md 手順A-3（成功・失敗を問わず常時）。
      # publish 先は ops-sync の ci-logs＝世界公開なので、万一のトークン混入に備えて伏字をかける。
      - name: Stage CI log snapshot
        if: always()
        run: |
          set -uo pipefail
          mkdir -p codex-review-inbox-out
          if [ -f logs/ci/scripts/codex-review-inbox.log ]; then
            sed -E \
              -e 's/gh[pousr]_[A-Za-z0-9]{20,}/[REDACTED-SECRET]/g' \
              -e 's/github_pat_[A-Za-z0-9_]{20,}/[REDACTED-SECRET]/g' \
              logs/ci/scripts/codex-review-inbox.log > codex-review-inbox-out/codex-review-inbox.log
          fi

      # dest は信号ごとに分ける（publish-ci-logs は publish 前に dest を rm -rf するため）。
      - name: Publish logs to ci-logs branch
        if: always()
        uses: ./ops-sync/.github/actions/publish-ci-logs
        with:
          source-dir: codex-review-inbox-out
          dest: codex-review-inbox
          commit-message: "ci(codex-review-inbox): open=${{ steps.collect.outputs.open_findings || '?' }}"
          token: ${{ github.token }}
