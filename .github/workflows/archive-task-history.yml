name: Archive task histories

# 各リポジトリのタスク履歴の保守バッチ（consolidate + archive。規約: shared/docs/task-history.md）。
#   1. docs/history-inbox/ の未統合フラグメント（エージェントが 1エントリ1ファイルで置いたもの）を
#      docs/AI_TASK_HISTORY.md へ取り込み、取り込んだフラグメントを削除する（consolidate）。
#   2. 取り込み後、保持量（直近2作業日分）を超えた古い日付のエントリを
#      docs/history-archive/<YYYY>.md へ移す（archive）。
# ops-sync 自身と全 consumer を1日1回巡回し、統合すべきフラグメントか超過エントリがあるリポジトリにだけ
# PR を生成する（無ければ何もしない）。
#
# consolidate/archive はどちらも決定的なファイル移動なので、エージェントのセッション（完了手順）ではなく
# ここで一括処理する。consumer 側に workflow・Secret を置かない原則（ops-sync-design.md）は
# 変えない: 実行主体はこの workflow だけで、consumer へは何も配布しない。
#
# MERGE_MODE の意味は sync.yml と同じ（機械的移動なので再レビュー不要という設計）。

on:
  schedule:
    - cron: '17 20 * * *' # 1日1回（JST 早朝）。統合前も history-inbox を読めば最新は拾えるので日次で足りる
  workflow_dispatch:

env:
  MERGE_MODE: direct

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        # ops-sync 自身＋consumers.txt（# と空行を除く）を JSON 配列にしてマトリクスへ渡す
        run: |
          list=$({ echo "${{ github.repository }}"; grep -vE '^[[:space:]]*(#|$)' consumers.txt; } | jq -R . | jq -cs .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  archive:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.prepare.outputs.repos) }}
    steps:
      - name: Checkout ops-sync (script source)
        uses: actions/checkout@v5

      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.OPS_SYNC_TOKEN }}
          path: target

      # ログは2つに分ける（→ docs/ci-logs.md「ログの公開先」）。詳細ログは統合・削除したフラグメントの
      # **ファイル名**を含み、それは対象リポジトリの中身（タスクのスラッグ）なので、public な ops-sync では
      # なく**対象リポジトリ自身の ci-logs** へ出す。ops-sync 側には件数だけのロールアップを残す。
      - name: Set up log directory
        run: |
          mkdir -p /tmp/ci-logs
          cat > /tmp/ci-logs/summary.md << EOF
          # Archive task history: ${{ matrix.repo }}
          - Run: ${{ github.run_id }}
          - Triggered by: ${{ github.event_name }}
          - Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Consolidate inbox and archive overflow
        id: archive
        # 出力（フラグメント名を含む）を **tee でジョブログに出さない**（MUST。docs/ci-logs.md 手順A-6）。
        # public リポジトリの run ログは world-readable で保持もリポジトリ設定任せなので、ci-logs の
        # 置き場だけ分けてもジョブログ側から同じものが読めてしまう。詳細は対象リポジトリの ci-logs で読む。
        run: |
          set -uo pipefail
          node scripts/archive-task-history.mjs target > /tmp/ci-logs/archive.log 2>&1

      - name: Write archive PR body
        run: |
          cat > "${{ runner.temp }}/archive-pr-body.md" << 'EOF'
          タスク履歴の保守（規約: `docs/task-history.md`。本文はそのまま・移動のみ）:

          - `docs/history-inbox/` の未統合フラグメントを `docs/AI_TASK_HISTORY.md` へ取り込み、
            取り込んだフラグメントを削除します。
          - 取り込み後、保持量（直近2作業日分）を超えた古い日付のエントリを `docs/history-archive/` へ移します。

          この PR は ops-sync の archive-task-history workflow（1日1回の集中バッチ）が自動生成しました。
          EOF

      # peter-evans/create-pull-request を使わない（→ docs/ci-logs.md 手順A-6）。あの action は
      # `git status` / `git commit` の出力をジョブログへ流すので、**対象リポジトリのファイル名
      # （＝private のタスクスラッグ）が public な ops-sync の run ログに載る**。`uses:` ステップの
      # 出力は呼び出し側から抑制できないため、git 操作ごと自前 action に移して出力を詳細ログ
      # （対象リポジトリ行き）へリダイレクトする。
      - name: Create or update archive PR
        id: create-pr
        uses: ./.github/actions/create-pr-quiet
        with:
          path: target
          repository: ${{ matrix.repo }}
          base: main
          branch: ops-sync/archive-task-history
          commit-message: 'chore: consolidate task history fragments and archive overflow'
          title: 'chore: タスク履歴フラグメントの統合と古いエントリのアーカイブ'
          body-path: ${{ runner.temp }}/archive-pr-body.md
          log-file: /tmp/ci-logs/create-pr.log
          token: ${{ secrets.OPS_SYNC_TOKEN }}

      - name: Merge archive PR (per MERGE_MODE)
        if: env.MERGE_MODE != 'off' && steps.create-pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.OPS_SYNC_TOKEN }}
        run: |
          url="${{ steps.create-pr.outputs.pull-request-url }}"
          # --delete-branch は create-pull-request の delete-branch: true の代わり
          # （自前 PR 作成に移したので、使い捨てブランチの後始末はこちらで行う）。
          if [ "$MERGE_MODE" = "direct" ]; then
            gh pr merge --squash --delete-branch "$url" \
              || echo "::warning::direct merge failed; PR left open: $url"
          else
            gh pr merge --auto --squash --delete-branch "$url" \
              || echo "::warning::auto-merge could not be enabled; PR left open: $url"
          fi

      - name: Record PR result
        if: always()
        run: |
          echo "- PR URL: ${{ steps.create-pr.outputs.pull-request-url }}" >> /tmp/ci-logs/summary.md
          echo "- Merge mode: ${MERGE_MODE}" >> /tmp/ci-logs/summary.md
          echo "- Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> /tmp/ci-logs/summary.md

      # 詳細ログ（フラグメント名を含む）→ 対象リポジトリ自身の ci-logs。可視性が対象の可視性に一致し、
      # 「なぜ自分の履歴 PR がこうなったか」を調べるエージェントは自分のリポジトリで読める。
      - name: Publish detailed CI logs to the target repo
        if: always()
        uses: ./.github/actions/publish-ci-logs
        with:
          repository: ${{ matrix.repo }}
          source-dir: /tmp/ci-logs
          dest: archive-task-history/latest
          history-dir: archive-task-history/history
          retention-days: "7"
          run-id: ${{ github.run_id }}
          commit-message: "ci-logs: archive-task-history (run ${{ github.run_id }})"
          token: ${{ secrets.OPS_SYNC_TOKEN }}

      # ops-sync（public）側のロールアップ。**件数・repo 名・PR URL まで**で、ファイル名や本文は出さない。
      # 対象が ops-sync 自身のときは上の詳細ログが既にこのリポジトリに出ているので二重に出さない。
      - name: Build public roll-up
        if: always() && matrix.repo != github.repository
        env:
          STATUS: ${{ steps.archive.outputs.status || 'failed-or-skipped' }}
        run: |
          mkdir -p /tmp/ci-logs-public
          cat > /tmp/ci-logs-public/summary.md << EOF
          # Archive task history: ${{ matrix.repo }}
          - Run: ${{ github.run_id }}
          - Triggered by: ${{ github.event_name }}
          - Result: ${STATUS}
          - Consolidated/Kept/Moved: ${{ steps.archive.outputs.consolidated || '?' }}/${{ steps.archive.outputs.kept || '?' }}/${{ steps.archive.outputs.moved || '?' }}
          - PR URL: ${{ steps.create-pr.outputs.pull-request-url }}
          - Merge mode: ${MERGE_MODE}
          - Detail log: \`archive-task-history/latest\` on the \`ci-logs\` branch of ${{ matrix.repo }}
          - Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Publish public roll-up
        if: always() && matrix.repo != github.repository
        uses: ./.github/actions/publish-ci-logs
        with:
          source-dir: /tmp/ci-logs-public
          dest: archive-task-history/${{ matrix.repo }}/latest
          # history は残す（件数だけなので安全で、日次バッチが回っているかの推移が見える）。
          history-dir: archive-task-history/${{ matrix.repo }}/history
          retention-days: "7"
          run-id: ${{ github.run_id }}
          commit-message: "ci-logs: archive-task-history ${{ matrix.repo }} (run ${{ github.run_id }})"
          token: ${{ secrets.OPS_SYNC_TOKEN }}
