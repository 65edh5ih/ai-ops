name: Publish ephemeral result
description: >-
  Publish a local directory snapshot into a slice of a dedicated *ephemeral*
  branch. Unlike `publish-ci-logs` (append-only history for durable CI logs),
  this leaves no git history: the branch is rewritten as a single orphan commit
  on every write, holding only the slices newer than the TTL
  (`retention-minutes`, else `retention-days`). Use it for read-once agent
  results (net-fetch) that must not accumulate — especially in public
  repositories, where anything that enters history is world-readable forever
  even after the file is deleted. A failed publish surfaces as a workflow
  warning without failing the job, unless the caller sets
  `fail-on-publish-error` (do that wherever a green run would be read as proof
  the branch changed).
inputs:
  source-dir:
    description: >-
      Local directory whose contents become the destination slice. Required
      unless prune-only is true.
    required: false
    default: ""
  dest:
    description: >-
      Slice path within the branch (e.g. `net-fetch/<request_id>`). Required
      unless prune-only is true. Must be caller-validated (no path traversal).
    required: false
    default: ""
  branch:
    description: Ephemeral branch to publish into.
    required: false
    default: "net-fetch-results"
  slice-root:
    description: Top-level directory containing per-result slices.
    required: false
    default: "net-fetch"
  retention-days:
    description: >-
      Slices older than this are dropped on every write. Must be a positive
      integer. Age comes from the `.published-at` marker this action writes into
      each slice; a slice whose marker is missing or unreadable is treated as
      expired (fail toward deletion, since the point of this branch is to not
      retain). Ignored when `retention-minutes` is set.
    required: false
    default: "3"
  retention-minutes:
    description: >-
      Same as `retention-days` but in minutes, for callers that need a TTL
      shorter than a day. When set to a positive integer this WINS over
      `retention-days`; empty (the default) keeps the day-based value, so
      existing callers are unaffected. A public runner wants a tight TTL because
      every extra minute is world-readable, while the day granularity is fine
      where results are private.
    required: false
    default: ""
  drop-slice:
    description: >-
      Name of a single slice under `slice-root` to delete regardless of its age,
      in addition to the normal expiry pass. Used for cleanup-on-read: once the
      agent has consumed a result there is no reason to keep it until the TTL.
      Only a bare slice name is accepted (no `/`, no `.`/`..`); anything else is
      refused so this input cannot be used to delete arbitrary paths. Empty
      (the default) means "drop nothing extra".
    required: false
    default: ""
  fail-on-publish-error:
    description: >-
      When "true", exit non-zero if the branch could not be pushed after all
      retries, instead of only warning. Set this wherever a caller would
      otherwise read a green run as proof that the branch was updated -- e.g.
      cleanup-on-read (a green run means "the slice is gone") and the fetch job
      (the result body lives only on the branch, so a failed publish means the
      result is unreachable). Left "false" for the scheduled sweep, where a
      transient failure is harmless because the next run retries.
    required: false
    default: "false"
  prune-only:
    description: >-
      When "true", only expire old slices (no slice is written). Used by the
      scheduled sweep so results do not linger while the relay sits idle.
    required: false
    default: "false"
  commit-message:
    description: Commit message for the rewritten branch.
    required: true
  token:
    description: "GitHub token with contents:write permission on this repository."
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SRC: ${{ inputs.source-dir }}
        DEST: ${{ inputs.dest }}
        BRANCH: ${{ inputs.branch }}
        SLICE_ROOT: ${{ inputs.slice-root }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        RETENTION_MINUTES: ${{ inputs.retention-minutes }}
        PRUNE_ONLY: ${{ inputs.prune-only }}
        DROP_SLICE: ${{ inputs.drop-slice }}
        FAIL_ON_PUBLISH_ERROR: ${{ inputs.fail-on-publish-error }}
        MSG: ${{ inputs.commit-message }}
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail

        if [ "$PRUNE_ONLY" != "true" ]; then
          if [ -z "$DEST" ]; then
            echo "::warning::publish-ephemeral: dest is empty; refusing to publish."
            exit 0
          fi
          if [ ! -d "$SRC" ]; then
            echo "::warning::publish-ephemeral: source dir '$SRC' is missing; nothing to publish."
            exit 0
          fi
          src_abs="$(cd "$SRC" && pwd)"
        fi

        case "$RETENTION_DAYS" in
          ''|*[!0-9]*) RETENTION_DAYS=3 ;;
        esac
        [ "$RETENTION_DAYS" -gt 0 ] || RETENTION_DAYS=3

        # Resolve the TTL to seconds. retention-minutes wins when it is a positive integer;
        # anything else (empty, or garbage) falls back to the day-based value so a typo cannot
        # silently shorten the TTL to zero and wipe a slice the caller is still reading.
        RETENTION_SECONDS="$(( RETENTION_DAYS * 86400 ))"
        case "$RETENTION_MINUTES" in
          ''|*[!0-9]*) : ;;
          *) [ "$RETENTION_MINUTES" -gt 0 ] && RETENTION_SECONDS="$(( RETENTION_MINUTES * 60 ))" ;;
        esac
        echo "publish-ephemeral: retention=${RETENTION_SECONDS}s"

        # Reject a malformed drop-slice here, NOT inside attempt_publish: the retry loop below
        # treats every non-zero return as "branch moved or transient", so a validation error
        # raised in there would be retried 5x and then downgraded to a warning with exit 0.
        #
        # Same structural policy as net-fetch.sh's structurally_valid_request_id: a shell `case`
        # over the whole value (NOT grep, whose ^/$ match per line and would pass a multiline
        # value whose first line looks fine). This rejects '/', '.', '..', and every control
        # character, so the value can neither escape SLICE_ROOT nor smuggle a newline followed by
        # a `::workflow command::` into the job log.
        #
        # The value is never echoed, even after passing validation: a caller can paste a
        # secret-shaped id (`ghp_...` passes [A-Za-z0-9._-]+) and on a public runner the job log
        # is world-readable. Correlation uses a short digest instead. Deliberately NOT duplicating
        # net-fetch.sh's SECRET_PATTERNS here -- keeping a second copy of that list is exactly the
        # drift AGENTS_COMMON warns about, and "never log it" covers the leak without a copy.
        drop_tag=""
        if [ -n "$DROP_SLICE" ]; then
          case "$DROP_SLICE" in
            # `.` must be listed on its own: it passes the charset test ('.' is allowed inside a
            # name) and does not match *..*, yet `rm -rf <root>/.` targets SLICE_ROOT itself.
            *[!A-Za-z0-9._-]*|*..*|.)
              echo "::error::publish-ephemeral: drop-slice must match [A-Za-z0-9._-]+ and must not contain '..'. Refusing (value not echoed: it may hold a secret)."
              exit 1
              ;;
          esac
          drop_tag="sha256:$(printf '%s' "$DROP_SLICE" | sha256sum | cut -c1-12)"
        fi

        tmp="$(mktemp -d)"
        cleanup() { rm -rf "$tmp"; }
        trap cleanup EXIT

        url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

        # Rebuild the branch from scratch and force-push, so nothing accumulates in history.
        # A concurrent net-fetch run would be clobbered by a blind force push, so the push is
        # leased on the sha we started from: if someone else republished meanwhile the push is
        # rejected and we redo the whole cycle against their state (their slice survives).
        attempt_publish() {
          rm -rf "$tmp"; mkdir -p "$tmp"

          local base=""
          if git clone --depth 1 --branch "$BRANCH" "$url" "$tmp" 2>/dev/null; then
            base="$(git -C "$tmp" rev-parse HEAD)"
          else
            echo "publish-ephemeral: branch '$BRANCH' not found; starting a fresh orphan branch."
            git clone --depth 1 "$url" "$tmp" || return 1
            git -C "$tmp" checkout --orphan "$BRANCH" >/dev/null 2>&1 || return 1
            git -C "$tmp" rm -rf . >/dev/null 2>&1 || true
          fi

          git -C "$tmp" config user.name "github-actions[bot]"
          git -C "$tmp" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ── expire old slices ────────────────────────────────────────────
          local now cutoff marker dir ts
          now="$(date -u +%s)"
          cutoff="$(( now - RETENTION_SECONDS ))"
          # A missing marker cannot establish a safe retention age. Fail toward deletion.
          if [ -d "${tmp}/${SLICE_ROOT}" ]; then
            while IFS= read -r -d '' dir; do
              if [ ! -f "${dir}/.published-at" ]; then
                echo "publish-ephemeral: expiring $(basename "$dir") (missing publication marker)"
                rm -rf "$dir"
              fi
            done < <(find "${tmp}/${SLICE_ROOT}" -mindepth 1 -maxdepth 1 -type d -print0 2>/dev/null)
          fi
          while IFS= read -r -d '' dir; do
            marker="${dir}/.published-at"
            [ -f "$marker" ] || continue
            ts="$(head -c 32 "$marker" 2>/dev/null | tr -dc '0-9')"
            if [ -z "$ts" ] || [ "$ts" -lt "$cutoff" ]; then
              echo "publish-ephemeral: expiring $(basename "$dir")"
              rm -rf "$dir"
            fi
          done < <(find "${tmp}/${SLICE_ROOT}" -mindepth 1 -maxdepth 1 -type d -print0 2>/dev/null)

          # ── drop one named slice regardless of age (cleanup-on-read) ──────
          # DROP_SLICE is validated as a bare name before the retry loop, so by here it
          # cannot escape SLICE_ROOT.
          if [ -n "$DROP_SLICE" ]; then
            if [ -d "${tmp}/${SLICE_ROOT}/${DROP_SLICE}" ]; then
              echo "publish-ephemeral: dropping slice ${drop_tag} (cleanup-on-read)"
              rm -rf "${tmp:?}/${SLICE_ROOT}/${DROP_SLICE}"
            else
              echo "publish-ephemeral: slice ${drop_tag} not present (already gone); nothing to drop."
            fi
          fi

          # ── write our own slice ──────────────────────────────────────────
          if [ "$PRUNE_ONLY" != "true" ]; then
            rm -rf "${tmp:?}/${DEST}"
            mkdir -p "${tmp}/${DEST}"
            cp -a "${src_abs}/." "${tmp}/${DEST}/"
            date -u +%s > "${tmp}/${DEST}/.published-at"
          fi

          # Single orphan commit: the branch never carries history of past results.
          git -C "$tmp" checkout --orphan __publish >/dev/null 2>&1 || return 1
          git -C "$tmp" add -A

          # Decide "did anything change?" by comparing the rebuilt tree to the tree we started
          # from -- NOT with `git diff --cached`. On an unborn orphan branch that diffs the index
          # against the *empty* tree, so a sweep that expires the last remaining slice looks like
          # "no changes" and returns without pushing, leaving that slice on the branch forever
          # (the TTL sweep could never empty the branch). Comparing trees makes emptying the
          # branch a real change, and --allow-empty lets the resulting empty commit be created.
          local new_tree old_tree
          new_tree="$(git -C "$tmp" write-tree)" || return 1
          if [ -n "$base" ]; then
            old_tree="$(git -C "$tmp" rev-parse "${base}^{tree}" 2>/dev/null || true)"
            if [ -n "$old_tree" ] && [ "$new_tree" = "$old_tree" ]; then
              echo "publish-ephemeral: nothing to change on '$BRANCH'."
              return 0
            fi
          fi
          git -C "$tmp" commit -q --allow-empty -m "$MSG" || return 1

          if [ -n "$base" ]; then
            git -C "$tmp" push --force-with-lease="${BRANCH}:${base}" origin "HEAD:${BRANCH}" 2>/dev/null
          else
            git -C "$tmp" push origin "HEAD:${BRANCH}" 2>/dev/null
          fi
        }

        pushed=0
        for i in 1 2 3 4 5; do
          if attempt_publish; then
            pushed=1
            break
          fi
          echo "publish-ephemeral: attempt $i failed (branch moved or transient); retrying..."
          sleep "$((i * 3))"
        done

        if [ "$pushed" != "1" ]; then
          # A caller that treats a green run as proof the branch changed must not get green here.
          if [ "$FAIL_ON_PUBLISH_ERROR" = "true" ]; then
            echo "::error::publish-ephemeral: failed to publish '${DEST:-<prune-only>}' to '${BRANCH}' after retries; the branch was NOT updated."
            exit 1
          fi
          echo "::warning::publish-ephemeral: failed to publish '${DEST:-<prune-only>}' to '${BRANCH}' after retries."
        fi
        exit 0
