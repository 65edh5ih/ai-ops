name: Net fetch

# AI エージェントの代理で「許可ドメインだけ」を公開取得するリレー（クリーンルーム実行）。
# エージェントは egress 制限下でも GitHub には到達できるので、この workflow を workflow_dispatch で
# 起動し、結果を読み戻す。手順は docs/net-fetch.md。
#
# 集約(=public な計算基盤 ops-runner 上で実行し無料枠で回す)と分散(=各 private repo 上で実行し結果を
# 非公開に保つ)の両モードで同じこの workflow を使う（正本は ops-sync の shared/。どのリポジトリで
# 起動するかがモードの違い）。**ops-sync 自身では動かさない**——エージェントが任意の外部コンテンツを
# 持ち込む経路を OPS_SYNC_TOKEN のあるリポジトリに置かないため（→ docs/ops-sync-design.md「実行基盤の分離」）。
# 将来の枠連動ルーティング（quota-gate）は「どちらで起動するか」を自動で選ぶ層で、この workflow 自体は変更不要。
#
# 応答本文の出口は結果ブランチ net-fetch-results の net-fetch/<request_id>/ スライス1本だけ
# （publish-ephemeral が毎回 orphan 1コミットに書き換える＝履歴に堆積せず TTL で失効する）。
# ジョブログには本文を出さない——ログは git ブランチではないので TTL が効かず、リポジトリ設定の
# Artifact and log retention に従って残るため（public では world-readable のまま）。ログに出すのは
# 照合用の meta と bytes/sha256 だけ。読了後は cleanup=true の dispatch でスライスを即削除する。
# ci-logs へは publish しない。net-fetch の結果は「読んだら用済みの一次データ」で、恒久ログの ci-logs に
# 混ぜると public リポジトリでは削除しても git 履歴に永久に残るため（→ docs/ci-logs.md）。
#
# secret は一切このジョブに渡さない（allowlist・SSRF ガード・secret スキャンは net-fetch.sh が enforce）。
# 唯一使うトークンは結果を結果ブランチへ push する publish-ephemeral 用の github.token で、取得ステップの
# env には載せない（クリーンルームに認証情報を持ち込ませない）。

on:
  workflow_dispatch:
    inputs:
      url:
        description: '取得先 URL（https のみ）。cleanup=true のときは不要'
        type: string
        required: false
      request_id:
        description: '相関 ID（[A-Za-z0-9._-]+）。結果は net-fetch-results の net-fetch/<request_id>/ に出る'
        type: string
        required: true
      cleanup:
        description: '"true" なら取得せず、request_id のスライスを即削除する（読了後の後片付け。→ docs/net-fetch.md 手順6）'
        type: string
        default: 'false'
      method:
        description: 'GET か HEAD'
        type: choice
        options: [GET, HEAD]
        default: GET
      max_bytes:
        description: '応答本文の上限バイト'
        type: string
        default: '5242880'
      timeout_seconds:
        description: '取得タイムアウト秒'
        type: string
        default: '30'
  # 休眠中に最後の結果が残り続けないための掃除。取得のたびに TTL 失効も走るので、これは
  # 「しばらく net-fetch を使わなかった」ケースだけを拾う。
  #
  # 日次にしてあるのは、掃除の間隔がそのまま TTL の超過分になるため。週1だと金曜に置かれた
  # スライスが日曜の掃除では未達（2日）で次の日曜まで残り、3日 TTL のはずが実質9日公開され続ける
  # （集約モードは public なので、これは「広告した保持期間より長く世界公開する」ことになる）。
  # 日次なら最大でも TTL + 1日に収まる。コストは1 run 数十秒＝課金は最小単位の1分/日。
  #
  # ただしこの日次実行は public リポジトリでだけ走る（sweep ジョブの `if` を見よ）。上の理由は
  # 「TTL を超えて世界公開する時間を最小化する」ことなので、結果が非公開な private リポジトリでは
  # 便益が発生しない一方、Actions 分数だけはアカウント枠に課金される。private では掃除を
  # 「次の取得」に寄せて枠を一切使わない。
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write        # publish-ephemeral が結果ブランチへ push するのに必要

concurrency:
  group: net-fetch-${{ github.event.inputs.request_id }}
  cancel-in-progress: false

env:
  RESULT_BRANCH: net-fetch-results
  RESULT_RETENTION_DAYS: '3'

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' && inputs.cleanup != 'true'
    runs-on: ubuntu-latest
    steps:
      # url は `cleanup` dispatch では不要なので required: false にしてある。取得側で空のまま
      # 進むと net-fetch.sh の中で分かりにくく落ちるので、ここで先に弾く。
      - name: Require url for a fetch dispatch
        if: inputs.url == ''
        run: |
          echo "::error::url は取得 dispatch では必須です（後片付けだけしたいなら cleanup=true で dispatch してください）。"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch (clean room)
        id: fetch
        uses: ./.github/actions/net-fetch
        with:
          url: ${{ inputs.url }}
          method: ${{ inputs.method }}
          request-id: ${{ inputs.request_id }}
          output-dir: net-fetch-out
          max-bytes: ${{ inputs.max_bytes }}
          timeout-seconds: ${{ inputs.timeout_seconds }}

      - name: Summarize
        if: always()
        # 生入力（url/request_id）を run: に ${{ }} で直接埋め込まない。GitHub が bash 実行前に
        # 展開するため request_id=$(...) 等でスクリプト注入されうる。値はすべて env 経由で渡し、
        # $VAR として printf する（env の値は再評価されない）。URL は伏字済み meta.txt から拾う。
        env:
          SAFE_REQUEST_ID: ${{ steps.fetch.outputs.safe-request-id }}
          STATUS: ${{ steps.fetch.outputs.status }}
          HTTP_STATUS: ${{ steps.fetch.outputs.http-status }}
          DEST: ${{ steps.fetch.outputs.dest }}
        run: |
          set -uo pipefail
          safe_url="(unavailable)"
          [ -f net-fetch-out/meta.txt ] && safe_url="$(grep -m1 '^url=' net-fetch-out/meta.txt | cut -d= -f2-)"
          {
            printf '## net-fetch\n\n'
            printf -- '- request_id: `%s`\n' "$SAFE_REQUEST_ID"
            printf -- '- url: `%s`\n' "$safe_url"
            printf -- '- status: **%s** (http %s)\n' "$STATUS" "$HTTP_STATUS"
            printf -- '- result slice: `%s/` on the `%s` branch\n' "$DEST" "$RESULT_BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"

      # 結果（status/meta/response）を結果ブランチの per-request スライスへ publish する。
      # publish-ci-logs ではなく publish-ephemeral を使う＝毎回 orphan 1コミットに書き換えるので、
      # 取得内容が git 履歴に堆積しない（public リポジトリでは履歴＝世界公開の恒久記録になるため）。
      - name: Publish result to the ephemeral result branch
        # dest が空（＝スクリプトが GITHUB_OUTPUT を書く前に異常終了）のときは publish しない。
        if: always() && steps.fetch.outputs.dest != ''
        uses: ./.github/actions/publish-ephemeral
        with:
          source-dir: net-fetch-out
          # 生入力ではなく、スクリプトが検証・サニタイズした dest を使う（path traversal 防止）。
          dest: ${{ steps.fetch.outputs.dest }}
          # 本文の出口はこのブランチだけ（ジョブログには出さない）なので、publish に失敗したら
          # 結果はどこからも読めない。警告で緑にせず赤で終わらせて、エージェントに再実行させる。
          fail-on-publish-error: 'true'
          branch: ${{ env.RESULT_BRANCH }}
          retention-days: ${{ env.RESULT_RETENTION_DAYS }}
          commit-message: "net-fetch: ${{ steps.fetch.outputs.dest }} (${{ steps.fetch.outputs.status }})"
          token: ${{ github.token }}

      # 取得のメタ情報だけをジョブログに出す。**応答本文は出さない**——ジョブログは git ブランチでは
      # ないので結果ブランチの TTL が効かず、リポジトリ設定の Artifact and log retention に従って
      # 数日〜数十日残る。public な集約モードではそれが world-readable のまま残るため、本文の出口は
      # 結果ブランチ1本に絞ってある（読み方は docs/net-fetch.md の手順5。本文が要るならブランチを読む。
      # dispatch できる権限があるランタイムはコンテンツ取得 API でも読めるので、これで読めなくなる
      # ランタイムは無い）。ここに出すのは「取得が成功したか・何バイトか・中身が同一か」を
      # 後から照合できる最小限（size と sha256）だけ。
      - name: Echo result metadata to job log
        # 参照するのは composite action が宣言した出力名（`result-dir`）。net-fetch.sh が
        # GITHUB_OUTPUT に書く生のキー（`result_dir`）ではない——後者を書くと常に空になり、
        # この if が偽になってジョブログ出力が毎 run 黙ってスキップされる。
        if: always() && steps.fetch.outputs.result-dir != ''
        env:
          RESULT_DIR: ${{ steps.fetch.outputs.result-dir }}
        run: |
          set -uo pipefail

          # meta.txt は net-fetch.sh が組み立てた自前の要約だが、取得先が決めた文字列（最終 URL・
          # content-type 等）を含みうる。`::error::` 等が workflow command として解釈されるのを
          # 防ぐため stop-commands で囲む。トークンは推測されると止め損なうのでランダムにする。
          guard="nf-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::${guard}"

          echo "===== NET-FETCH META BEGIN ====="
          cat "$RESULT_DIR/meta.txt" 2>/dev/null || echo "(meta.txt missing)"
          echo "===== NET-FETCH META END ====="

          if [ -f "$RESULT_DIR/response.txt" ]; then
            echo "response.txt: bytes=$(wc -c < "$RESULT_DIR/response.txt" | tr -d ' ') sha256=$(sha256sum "$RESULT_DIR/response.txt" | cut -d' ' -f1)"
            echo "本文はジョブログに出さない。結果ブランチ '${RESULT_BRANCH}' のスライスを読むこと。"
          else
            echo "(no response body: status is not ok, or method was HEAD)"
          fi

          echo "::${guard}::"

  # 休眠中の掃除専用。取得はせず、TTL を過ぎたスライスを落とすだけ。
  # 読了後の後片付け。エージェントが結果を読み終えた直後に cleanup=true で dispatch する経路で、
  # 公開時間を「TTL の3日」から「実際の読み取りにかかった数分」に縮める（→ docs/net-fetch.md 手順6）。
  # 定期 sweep と違って**使ったときだけ**1 run なので、休眠中は1分も課金されない。
  cleanup:
    if: github.event_name == 'workflow_dispatch' && inputs.cleanup == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 取得 run は、request_id が構造検査か secret 判定に引っかかると結果を request_id ではなく
      # net-fetch/_invalid-<digest> へ退避する（net-fetch.sh）。cleanup は取得とは別 run なので
      # 「どちらへ publish されたか」を知らない。digest は**生 ID から決まる**ので同じものを
      # ここで組み立て直し、**両方**を落とす（片方しか渡さないと、退避されたスライスが残ったまま
      # 「nothing to drop」で緑になり、緑＝消えたという手順6の完了条件が嘘になる）。
      - name: Resolve the slices this request may have produced
        id: slices
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -uo pipefail

          # 退避先の digest は生の入力バイト列に対して取る（net-fetch.sh と同じ計算）。
          digest="$(printf '%s' "$REQUEST_ID" | sha256sum | cut -c1-12)"

          # 生 ID をスライス名として渡すのは、それが素のスライス名として妥当なときだけ。
          # 構造的に不正な ID（`/` や改行を含む等）は取得側もスライス名に使っていないので、
          # 渡すと publish-ephemeral の検証で run 全体が落ち、退避スライスを消せなくなる。
          # 改行入りの ID をそのまま渡さないことは安全上も要る——drop-slice は1行1名なので、
          # 複数行の ID は「複数のスライス名」に化けて無関係なスライスを消しうる。
          names=""
          case "$REQUEST_ID" in
            ''|*[!A-Za-z0-9._-]*|*..*|.)
              echo "request_id is not a bare slice name; dropping only the _invalid-<digest> fallback."
              ;;
            *) names="$REQUEST_ID" ;;
          esac

          # 以下に流す2行はどちらもサニタイズ済み（検証を通った素の名前／16進 digest）なので、
          # 固定デリミタで multiline output に載せても入力側から区切りを偽装できない。
          {
            echo 'names<<__NET_FETCH_SLICES__'
            [ -n "$names" ] && printf '%s\n' "$names"
            printf '_invalid-%s\n' "$digest"
            echo '__NET_FETCH_SLICES__'
          } >> "$GITHUB_OUTPUT"

      - name: Drop the consumed result slice
        uses: ./.github/actions/publish-ephemeral
        with:
          # prune-only＝自分のスライスは書かない。drop-slice で読了済みスライスを齢に関係なく落とす。
          # 1行1スライス名。各行が素のスライス名かは publish-ephemeral 側が検証する（パス脱出防止）。
          prune-only: 'true'
          drop-slice: ${{ steps.slices.outputs.names }}
          # 緑＝「消えた」として手順6が完了判定に使うので、push できなかったら赤で終わらせる。
          fail-on-publish-error: 'true'
          branch: ${{ env.RESULT_BRANCH }}
          retention-days: ${{ env.RESULT_RETENTION_DAYS }}
          commit-message: "net-fetch: drop consumed slice"
          token: ${{ github.token }}

  # 休眠中の掃除（バックストップ）。上の cleanup が主経路で、これはエージェントが読了後の dispatch を
  # し損ねた（落ちた・忘れた）ときの取りこぼしを拾う。
  sweep:
    # public のみ。TTL 超過の世界公開を防ぐのが日次掃除の目的で、private では便益が無いのに
    # 枠だけ課金されるため（理由は上の schedule のコメント）。private では skip＝分数ゼロで、
    # 掃除は次の取得時の publish-ephemeral（同じ失効ロジックを通る）に委ねる。
    if: github.event_name == 'schedule' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Expire old result slices
        uses: ./.github/actions/publish-ephemeral
        with:
          prune-only: 'true'
          branch: ${{ env.RESULT_BRANCH }}
          retention-days: ${{ env.RESULT_RETENTION_DAYS }}
          commit-message: "net-fetch: expire result slices older than ${{ env.RESULT_RETENTION_DAYS }}d"
          token: ${{ github.token }}
